sonar.projectKey=fikua_fikua-lab-idp
sonar.organization=fikua

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=fikua-lab-idp
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Generated by `go test -coverprofile=coverage.out ./...` in the SonarQube
# CI job, before the scan runs — without this, SonarCloud reports 0%
# coverage for every push regardless of actual test coverage.
sonar.go.coverage.reportPaths=coverage.out
