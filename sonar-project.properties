sonar.projectKey=fikua_fikua-lab-idp
sonar.organization=fikua

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=fikua-lab-idp
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Generated by `go test -coverprofile=coverage.out ./...` in the SonarQube
# CI job, before the scan runs — without this, SonarCloud reports 0%
# coverage for every push regardless of actual test coverage.
sonar.go.coverage.reportPaths=coverage.out

# _test.go files themselves are never exercised by another test — Go's own
# coverage tooling always reports 0% for the test file a test lives in, not
# because it's untested but because "a test covering a test" isn't a thing.
# Without this exclusion, a PR that only adds tests (no production-code
# lines) has 100% of its new lines sitting in *_test.go, and new_coverage
# is unconditionally 0% regardless of how well the production code ends up
# covered — a Quality Gate failure with no possible fix. Standard practice
# for Go projects on SonarCloud.
sonar.coverage.exclusions=**/*_test.go
