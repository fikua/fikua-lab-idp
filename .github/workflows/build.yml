name: Build & test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: '1.26'

      # sonar-project.properties points sonar.go.coverage.reportPaths at
      # this file — without it, SonarCloud has no coverage data at all
      # (not "coverage is low", literally none reported) and the Quality
      # Gate's new_coverage condition fails on every push regardless of
      # how well-tested the new code actually is.
      #
      # -coverpkg=./... matters here specifically: several packages (e.g.
      # internal/sdjwtverify) are only ever exercised indirectly, from
      # internal/verifier's own test package, not from tests living in
      # their own package. Without -coverpkg, `go test` only attributes
      # coverage to the package a test file lives in, so those
      # cross-package-only hits are silently dropped and SonarCloud sees
      # 0% on files that are, in fact, tested.
      - name: go test with coverage
        run: go test -coverprofile=coverage.out -coverpkg=./... ./...

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995  # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
